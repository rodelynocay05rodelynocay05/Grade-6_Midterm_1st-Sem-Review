body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 20%,#000a 100%)}
.decor{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.bat{position:absolute;top:-50px;color:#03040a;font-size:26px;text-shadow:0 0 5px #8394bd;animation:batAcross linear infinite}
@keyframes batAcross{from{transform:translateX(-15vw) translateY(0) rotate(-8deg)}50%{transform:translateX(55vw) translateY(65px) rotate(9deg)}to{transform:translateX(115vw) translateY(-12px) rotate(-5deg)}}
.app{position:relative;z-index:2;max-width:1120px;margin:auto;padding:clamp(10px,2.4vw,24px)}
header{text-align:center;padding:8px 8px 18px}
.badge{display:inline-block;background:#100d20e8;border:1px solid #d6b6ff;color:#f6dcff;padding:7px 14px;border-radius:99px;font-size:.78rem;font-weight:950;letter-spacing:.09em;box-shadow:0 0 18px #9f72ff44}
h1{font-size:clamp(1.8rem,5vw,3.1rem);line-height:1.05;margin:12px 0 8px;color:#fff3c4;text-shadow:0 3px 0 #271331,0 0 20px #f7a62b99}
header p{font-weight:700;margin:5px 0;color:#f0eaff;text-shadow:0 2px 4px #000}
.panel{background:transparent;border:0;border-radius:0;box-shadow:none;padding:clamp(10px,2vw,20px);backdrop-filter:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
.pill{background:#211936;border:1px solid #75609d;padding:7px 11px;border-radius:99px;font-weight:850;font-size:.88rem;color:#fff4d0}
button{font:inherit;border:0;border-radius:14px;padding:12px 17px;font-weight:850;cursor:pointer;transition:filter .15s,box-shadow .15s}
button:hover{filter:brightness(1.15)}button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.primary{background:linear-gradient(135deg,#a78bfa,#7045b8);color:white;box-shadow:0 4px #3b236a}.soft{background:#252033;color:#f7eaff;border:1px solid #73628c}
.mode{background:#171326;border:2px solid #54436f;text-align:left;padding:16px;min-height:95px;color:#fff4d8}.mode strong{display:block;font-size:1.05rem}.mode small{display:block;color:#d2c6e9;margin-top:4px;font-weight:600}.mode.active{border-color:#ffd76a;background:#30203e;box-shadow:0 0 18px #ffd76a33}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.note{color:#d5cce8;font-size:.9rem;line-height:1.5}
.progress{height:10px;background:#30273d;border-radius:99px;overflow:hidden;margin:15px 0 20px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#b89aff,#ffd76a);transition:width .3s}
.question{font-size:clamp(1.25rem,3vw,1.8rem);line-height:1.3;margin:10px 0 18px;color:#fff5d6;text-shadow:0 2px 5px #000}
.category{font-size:.8rem;font-weight:950;letter-spacing:.12em;color:#d4baff}
.stage{position:relative;height:clamp(330px,48vh,500px);overflow:hidden;border:0;border-radius:0;background:transparent;box-shadow:none;isolation:isolate}
.stage:before{content:"🦇     ✦             🦇";position:absolute;top:12px;left:0;right:0;text-align:center;color:#d9caff;font-size:1.2rem;letter-spacing:1.5rem;opacity:.7;pointer-events:none}
.answer{position:absolute;width:min(46%,340px);min-height:62px;display:block;text-align:center;padding:12px 10px;color:#fff8dc;background:transparent;border:0;border-radius:0;box-shadow:none;text-shadow:0 3px 8px #000,0 0 12px #000;animation:drift var(--dur,4s) ease-in-out infinite alternate;animation-delay:var(--delay,0s);z-index:2;font-size:clamp(1.2rem,2.8vw,1.7rem);font-weight:900;line-height:1.25}
.answer .num{display:none}
.answer:hover{z-index:5;color:#ffe58b;text-shadow:0 0 14px #ffdb75,0 3px 7px #000;transform:scale(1.08)}
.answer.correct{color:#8dffbd;text-shadow:0 0 18px #22ff9b,0 3px 7px #000;animation:none}
.answer.wrong{color:#ff9eaa;text-shadow:0 0 16px #ff385a,0 3px 7px #000;animation:none}
@keyframes drift{0%{transform:translate(0,0) rotate(-3deg)}25%{transform:translate(10px,-18px) rotate(2deg)}50%{transform:translate(-9px,13px) rotate(-1deg)}75%{transform:translate(14px,6px) rotate(3deg)}100%{transform:translate(-5px,-12px) rotate(-2deg)}}
.feedback{min-height:44px;margin:13px 0 3px;font-weight:850;line-height:1.45;color:#fff4d7}.good{color:#91ffc0}.bad{color:#ff9aa9}
.controls{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}.hidden{display:none!important}
.end{text-align:center}.score{font-size:4.5rem;color:#ffe07b;font-weight:1000;line-height:1}.review{display:grid;gap:9px;text-align:left;margin:20px 0}.review div{background:#171326;border-left:5px solid #a78bfa;border-radius:12px;padding:12px}
.smoke{position:absolute;z-index:8;pointer-events:none;width:16px;height:16px;border-radius:50%;background:#d6d1e5;box-shadow:0 0 10px #fff8;animation:smokePop .85s ease-out forwards}
@keyframes smokePop{0%{opacity:.95;transform:translate(0,0) scale(.3)}35%{opacity:.8}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(5);filter:blur(5px)}}
.popstar{position:absolute;z-index:9;pointer-events:none;font-size:20px;animation:starPop .75s ease-out forwards}
@keyframes starPop{to{transform:translate(var(--sx),var(--sy)) rotate(180deg) scale(.2);opacity:0}}
footer{text-align:center;padding:15px 5px;color:#eee1ff;text-shadow:0 2px 4px #000;font-size:.84rem}
@media(max-width:650px){.modes{grid-template-columns:1fr}.stage{height:430px}.answer{width:48%;font-size:clamp(1.1rem,4vw,1.35rem);padding:10px 5px;min-height:58px}.answer .num{display:none}.panel{border-radius:18px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
.panel h2,.panel p{color:#fff5d6;text-shadow:0 2px 6px #000}.start-grid{background:transparent}.mode{background:#09081766;backdrop-filter:blur(2px)}

/* Zombie answer race */
#answers{position:relative;overflow:hidden;height:340px;min-height:340px;border-radius:14px;width:100%}
.answer{left:-48%;width:min(43%,340px);min-height:70px;padding:8px 10px 10px;white-space:normal;animation: zombieWalk var(--walk,10s) linear forwards;animation-delay:0s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;z-index:3}
.answer::before{content:none}
.answer:hover{transform:scale(1.04)}
.answer.correct,.answer.wrong{animation-play-state:paused!important}
@keyframes zombieWalk{from{left:-48%}to{left:110%}}

</style>

<section id="home">


<div class="modes">
<button class="mode active" data-mode="all"><strong>🌟 Full Review</strong><small>33 textquestions · Units 1–2</small></button>
<button class="mode" data-mode="u1"><strong>🌏 Unit 1</strong><small>Countries and origins</small></button>
<button class="mode" data-mode="u2"><strong>🚌 Unit 2</strong><small>Transportation</small></button>
</div>
<button class="primary" id="start">Start Game →</button>

</section>
<section id="play" class="hidden">
<div class="row"><span class="pill" id="unit">Unit 1</span><span class="pill">⭐ Score: <span id="score">0</span></span><span class="pill">Question <span id="qnum">1</span>/<span id="qtotal">33</span></span></div>
<div class="progress"><div id="bar"></div></div><div class="category" id="category">COUNTRIES</div><h2 class="question" id="question"></h2>
<div class="stage" id="answers" aria-label="Floating answer choices"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="controls"><button class="soft" id="exit">Exit game</button><button class="primary" id="next" disabled>Next question →</button></div>
</section>
<section id="finish" class="end hidden"><div style="font-size:2.2rem">🏆⚡🎉</div><h2>Quest Complete!</h2><div class="score"><span id="finalScore">0</span><span style="font-size:1.3rem;color:#65758d"> / <span id="finalTotal">33</span></span></div><p id="message"></p><div class="review" id="review"></div><button class="primary" id="again">Play Again ↻</button> <button class="soft" id="homeBtn">Choose a mode</button></section>
</main>
</div>
<script>
const questions=[
[1,"Countries","Look at the flag. Which country is it?",["Australia","India","Japan","Singapore"],0,"Australia." ,"flag-au"],
[1,"Countries","Look at the flag. Which country is it?",["Japan","Spain","Taiwan","the USA"],0,"Japan.","flag-jp"],
[1,"Countries","Look at the flag. Which country is it?",["Singapore","India","Australia","the UK"],0,"Singapore.","flag-sg"],
[1,"Target Language","I am from Taiwan. Choose the missing word: “I’m ___ Taiwan.”",["from","by","on","at"],0,"I’m from Taiwan."],
[1,"Target Language","Choose the correct question.",["Is she from India?","Does she from India?","Are she from India?","She from India?"],0,"Is she from India?"],
[1,"Target Language","She is from India. What can you say?",["Yes, she is.","Yes, she does.","Yes, she are.","Yes, she am."],0,"Yes, she is."],
[1,"Target Language","She is not from India. What can you say?",["No, she doesn’t.","No, she isn’t.","No, she aren’t.","No, she not."],1,"No, she isn’t."],
[1,"Grammar","I ___ from Taiwan.",["am","is","are","does"],0,"I am from Taiwan."],
[1,"Grammar","They ___ from the UK.",["am","is","are","does"],2,"They are from the UK."],
[1,"Grammar","Where ___ Amy from?",["am","is","are","do"],1,"Where is Amy from?"],
[1,"Phonics · ir","Which word has the “ir” sound?",["bird","park","corn","farm"],0,"bird"],
[1,"Phonics · ir","Which word has the “ir” sound?",["shirt","horse","fork","shark"],0,"shirt"],
[1,"Phonics · ur","Which word has the “ur” sound?",["nurse","corn","park","bird"],0,"nurse"],
[1,"Phonics · ur","Which word has the “ur” sound?",["purple","farm","short","shark"],0,"purple"],
[1,"Vocabulary","What does “bird” mean in Chinese?",["公園","小鳥","黑暗的","護理師"],1,"小鳥"],
[1,"Vocabulary","What does “park” mean in Chinese?",["公園","小鳥","黑暗的","護理師"],0,"公園"],
[1,"Reading","Mia and Amber are in Egypt. The sun is shining. Is it sunny or rainy?",["Sunny","Rainy","Snowy","Windy"],0,"It is sunny."],
[1,"Reading","Mia and Amber are in Egypt. They buy souvenirs. What do they buy?",["Souvenirs","Bicycles","School bags","Train tickets"],0,"They buy souvenirs."],
[1,"Reading","Mia and Amber buy souvenirs. Then they go to the museum. Where do they go?",["The museum","The hospital","The supermarket","The library"],0,"They go to the museum."],
[2,"Transportation","I go to school by bike. Choose the missing word: “I go to school ___ bike.”",["by","on","at","in"],0,"I go to school by bike."],
[2,"Transportation","Which phrase is correct?",["by foot","on foot","in foot","with foot"],1,"on foot"],
[2,"Target Language","He goes to school by bus. Which answer is correct? “Does he go by bus?”",["Yes, he does.","Yes, he is.","Yes, he do.","Yes, he goes."],0,"Yes, he does."],
[2,"Target Language","He does not go by bus. He walks to school. He goes ___ .",["from Taiwan","on foot","at six","by country"],1,"on foot"],
[2,"Grammar","How ___ you go to school?",["do","does","is","are"],0,"How do you go to school?"],
[2,"Grammar","How ___ Emma go to school?",["do","does","is","are"],1,"How does Emma go to school?"],
[2,"Grammar","Choose the correct sentence.",["She go to school by bus.","She goes to school by bus.","She going to school by bus.","She do goes to school by bus."],1,"She goes to school by bus."],
[2,"Transportation","Which words mean taking the MRT?",["by taxi","by metro / MRT","on foot","by scooter"],1,"by metro / MRT"],
[2,"Phonics · ar","Which word has the “ar” sound?",["farm","corn","fork","horse"],0,"farm"],
[2,"Phonics · ar","Which word has the “ar” sound?",["shark","short","corn","fork"],0,"shark"],
[2,"Phonics · or","Which word has the “or” sound?",["horse","shark","farm","park"],0,"horse"],
[2,"Phonics · or","Which word has the “or” sound?",["short","dark","farm","park"],0,"short"],
[2,"Reading","Mia goes to school by bike. How does Mia go to school?",["She rides a bike.","She goes by bus.","She goes by train.","She walks."],0,"Mia rides a bike to school."],
[2,"Reading","A boy in Egypt goes to school on a camel. What does he ride?",["A camel","A bike","A bus","A train"],0,"He rides a camel."]
];
let mode="all",list=[],idx=0,score=0,done=false,missed=[],selected=null;
const $=id=>document.getElementById(id);
["🦇","🦇","🦇","✦","🦇"].forEach((s,i)=>{let e=document.createElement("div");e.className="bat";e.textContent=s;e.style.top=(4+i*12)+"%";e.style.animationDuration=(13+i*3)+"s";e.style.animationDelay=(-i*3)+"s";$("decor").appendChild(e)});
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode});
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function screen(id){["home","play","finish"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function start(){list=shuffle(questions.filter(q=>mode==="all"||(mode==="u1"&&q[0]===1)||(mode==="u2"&&q[0]===2)).map(q=>({...q,a:[...q[3]],correct:q[3][q[4]]})));list.forEach(q=>{q.correct=q.a[q[4]];q.a=shuffle(q.a);q.correctIndex=q.a.indexOf(q.correct)});idx=0;score=0;missed=[];screen("play");render()}
function render(){
 done=false;selected=null;let q=list[idx];
 $("unit").textContent="Unit "+q[0]+" · "+(q[0]===1?"Where Are You From?":"How Do You Go to School?");
 $("score").textContent=score;$("qnum").textContent=idx+1;$("qtotal").textContent=list.length;
 $("bar").style.width=(idx/list.length*100)+"%";$("category").textContent=q[1].toUpperCase();
 $("question").textContent=q[2];$("feedback").textContent="";$("feedback").className="feedback";
 const oldFlag=document.getElementById("questionFlag");if(oldFlag)oldFlag.remove();
 if(q[6]){const f=document.createElement("div");f.id="questionFlag";f.style.margin="8px 0 14px";f.style.display="flex";f.style.justifyContent="center";
 const flags={
 "flag-au":`<svg width="180" height="100" viewBox="0 0 180 100" aria-label="Australia flag"><rect width="180" height="100" fill="#012169"/><path d="M0 0L76 42M76 0L0 42" stroke="white" stroke-width="12"/><path d="M0 0L76 42M76 0L0 42" stroke="#C8102E" stroke-width="5"/><path d="M38 0V42M0 21H76" stroke="white" stroke-width="16"/><path d="M38 0V42M0 21H76" stroke="#C8102E" stroke-width="7"/><g fill="white"><path d="M125 18l3 8 8 0-6 5 2 8-7-5-7 5 2-8-6-5 8 0z"/><path d="M94 57l2 5 5 0-4 3 1 5-4-3-4 3 1-5-4-3 5 0z"/><path d="M145 59l2 5 5 0-4 3 1 5-4-3-4 3 1-5-4-3 5 0z"/></g></svg>`,
 "flag-jp":`<svg width="180" height="100" viewBox="0 0 180 100" aria-label="Japan flag"><rect width="180" height="100" fill="white"/><circle cx="90" cy="50" r="27" fill="#BC002D"/></svg>`,
 "flag-sg":`<svg width="180" height="100" viewBox="0 0 180 100" aria-label="Singapore flag"><rect width="180" height="50" fill="#EF3340"/><rect y="50" width="180" height="50" fill="white"/><circle cx="31" cy="24" r="15" fill="white"/><circle cx="37" cy="20" r="12" fill="#EF3340"/><g fill="white"><circle cx="55" cy="11" r="2.5"/><circle cx="63" cy="18" r="2.5"/><circle cx="60" cy="28" r="2.5"/><circle cx="49" cy="28" r="2.5"/><circle cx="47" cy="17" r="2.5"/></g></svg>`};
 f.innerHTML=flags[q[6]]||"";$("question").after(f);}

 $("next").disabled=true;$("next").textContent=idx===list.length-1?"See results →":"Next question →";
 let area=$("answers");area.innerHTML="";
 const lanes=[8,88,168,248];
 q.a.forEach((a,i)=>{
   let b=document.createElement("button");b.className="answer";b.dataset.index=i;
   const zombie=document.createElement("span");
   zombie.textContent="🧟";
   zombie.style.display="block";
   zombie.style.fontSize="2.6rem";
   zombie.style.lineHeight="1";
   zombie.style.marginBottom="3px";
   zombie.style.filter="drop-shadow(0 3px 4px #000)";
   const answerText=document.createElement("span");
   answerText.textContent=a;
   b.appendChild(zombie);
   b.appendChild(answerText);
   b.style.top=lanes[i]+"px";
   b.style.setProperty("--walk",(8.5+Math.random()*2.5)+"s");
   b.addEventListener("click",()=>check(i,b));
   b.addEventListener("animationend",()=>{
     if(done||!b.isConnected)return;
     b.remove();
     if(area.querySelectorAll(".answer").length===0){
       done=true;
       $("feedback").textContent="Too slow! The zombies got away!";
       $("feedback").className="feedback bad";
       $("next").disabled=false;
       $("bar").style.width=((idx+1)/list.length*100)+"%";
     }
   });
   area.appendChild(b);
 });
}
function makeSmoke(button){
 const stage=$("answers"),sr=stage.getBoundingClientRect(),br=button.getBoundingClientRect();
 const x=br.left-sr.left+br.width/2,y=br.top-sr.top+br.height/2;
 for(let i=0;i<10;i++){
   let puff=document.createElement("span");puff.className="smoke";
   puff.style.left=(x-8+(Math.random()*22-11))+"px";puff.style.top=(y-8+(Math.random()*22-11))+"px";
   puff.style.setProperty("--sx",(Math.random()*130-65)+"px");puff.style.setProperty("--sy",(Math.random()*-110-10)+"px");
   stage.appendChild(puff);setTimeout(()=>puff.remove(),900);
 }
 for(let i=0;i<5;i++){
   let star=document.createElement("span");star.className="popstar";star.textContent=["✦","☠","✨"][i%3];
   star.style.left=x+"px";star.style.top=y+"px";star.style.setProperty("--sx",(Math.random()*150-75)+"px");star.style.setProperty("--sy",(Math.random()*-100-10)+"px");
   stage.appendChild(star);setTimeout(()=>star.remove(),800);
 }
}
function check(n,button){
 if(done)return;done=true;let q=list[idx],buttons=[...document.querySelectorAll(".answer")];
 buttons.forEach((b,i)=>{b.disabled=true;b.style.animationPlayState="paused";b.style.animation="none";if(i===q.correctIndex)b.classList.add("correct")});
 makeSmoke(button);
 if(n===q.correctIndex){
   score++;$("score").textContent=score;
   $("feedback").textContent=q[5];$("feedback").classList.add("good");
   button.textContent=list[idx].a[n];
 }else{
   button.classList.add("wrong");$("feedback").textContent=q[5];$("feedback").classList.add("bad");
   missed.push({q:q[2],correct:q.correct,why:q[5]});
 }
 $("next").disabled=false;$("bar").style.width=((idx+1)/list.length*100)+"%";
}
function finish(){screen("finish");$("finalScore").textContent=score;$("finalTotal").textContent=list.length;let p=score/list.length;$("message").textContent=p===1?"Perfect score! The witch is impressed by your English!":p>=.8?"Great job! You are an English superstar!":p>=.6?"Nice effort! Review the answers below and try again.":"Keep practicing. The witch believes in you!";let r=$("review");r.innerHTML="";if(!missed.length)r.textContent="Perfect round — every answer was correct!";else{let h=document.createElement("h3");h.textContent="Answers to review";r.appendChild(h);missed.forEach(m=>{let d=document.createElement("div");d.innerHTML="<strong></strong><p></p><small></small>";d.querySelector("strong").textContent=m.q;d.querySelector("p").textContent="Correct answer: "+m.correct;d.querySelector("small").textContent=m.why;r.appendChild(d)})}}
$("start").onclick=start;$("next").onclick=()=>{if(idx<list.length-1){idx++;render()}else finish()};$("exit").onclick=()=>screen("home");$("again").onclick=start;$("homeBtn").onclick=()=>screen("home");
</script></body></html>
